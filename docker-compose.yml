services:
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - app-network

  business-service:
    build:
      context: ./business-service
    container_name: business-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
